# Server Configuration
server.port=8080

# Spring Data Source (MySQL Configuration)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/collections_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server error message inclusion (Bug #12)
server.error.include-message=always
server.error.include-binding-errors=always

# CORS allowed origins (Bug #11)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Custom Application Properties (JWT Configuration)
jwt.secret=${JWT_SECRET:9a2f8c7e1d4b6a0e3f5c7b9a1e3f5c7b9a1e3f5c7b9a1e3f5c7b9a1e3f5c7b9a}
jwt.expiration-ms=86400000

# P1 #41 -- Stripe test mode. Replace with your own test-mode keys from the Stripe dashboard.
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_replace_me}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_replace_me}

